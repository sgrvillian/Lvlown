<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050007">
<title>XIRUS MODZ | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Dela+Gothic+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#050007;--card:#120a1a;--line:#2a1535;--pink:#ff2d95;--pink2:#ff6ec4;--text:#f4eef8;--dim:#9b8aa8;--success:#22c55e;--danger:#ef4444;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,45,149,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,149,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 15%,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000 15%,transparent 75%)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:1}
.orb-1{width:480px;height:480px;background:var(--pink);top:-180px;right:-140px;opacity:.2;animation:float 18s infinite alternate ease-in-out}
.orb-2{width:420px;height:420px;background:#7a2cff;bottom:-180px;left:-140px;opacity:.14;animation:float 22s infinite alternate-reverse ease-in-out}
@keyframes float{to{transform:translate(30px,40px)}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.back{position:fixed;top:calc(16px + env(safe-area-inset-top,0));left:16px;z-index:5;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(11,5,16,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--dim);font-size:12px;font-weight:600;letter-spacing:2px;text-decoration:none;transition:.25s}
.back:hover{color:#fff;border-color:var(--pink)}
.login-card{position:relative;z-index:2;width:100%;max-width:420px;padding:34px 28px;border-radius:32px;background:linear-gradient(165deg,rgba(24,12,34,.92),rgba(10,5,16,.95));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(255,45,149,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:up .7s var(--ease) both}
.brand{text-align:center;margin-bottom:26px}
.brand-icon-wrap{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;padding:2px;background:conic-gradient(var(--pink),#7a2cff,var(--pink2),var(--pink));box-shadow:0 0 36px rgba(255,45,149,.45)}
.brand-icon{width:100%;height:100%;border-radius:50%;background:#0b0510;display:grid;place-items:center;color:var(--pink2);font-size:24px}
.brand-name{font-family:'Anton','Impact',sans-serif;font-size:34px;letter-spacing:1px;text-transform:uppercase;line-height:1}
.brand-name span{color:var(--pink)}
.brand-sub{margin-top:8px;color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase}
.tab-switch{display:flex;gap:4px;padding:4px;border-radius:999px;background:#0b0510;border:1px solid var(--line);margin-bottom:22px}
.tab-btn{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.3s var(--ease)}
.tab-btn:hover{color:#fff}
.tab-btn.active{background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 6px 20px rgba(255,45,149,.35)}
.form-section{display:none}
.form-section.active{display:block;animation:up .45s var(--ease)}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.input-wrap{position:relative}
.input-wrap .field-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px;transition:.25s}
.input-wrap input{width:100%;min-height:52px;padding:0 18px 0 46px;border-radius:999px;background:#0b0510;border:1px solid var(--line);color:#fff;font-size:16px;outline:none;transition:.25s}
.input-wrap input::placeholder{color:#5c4a69}
.input-wrap input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,45,149,.14)}
.input-wrap:focus-within .field-icon{color:var(--pink2)}
.submit-btn{width:100%;min-height:52px;margin-top:8px;border:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--pink2));color:#fff;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 28px rgba(255,45,149,.35);transition:transform .25s var(--ease),box-shadow .25s}
.submit-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 34px rgba(255,45,149,.55)}
.submit-btn:active:not(:disabled){transform:scale(.97)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;font-size:13px;margin-bottom:16px}
.msg.show{display:flex;animation:up .3s var(--ease)}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#ff8a8a}
.msg.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#6ee7a0}
.footer{margin-top:24px;text-align:center;color:var(--dim);font-size:12px;letter-spacing:1px}
.footer i{color:var(--pink);margin-right:6px}
@media(max-width:480px){body{padding:76px 14px 24px;align-items:flex-start}.login-card{padding:28px 20px;border-radius:28px}.brand-name{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== match home page look ===== */
.herobg{position:fixed;inset:0;z-index:0;pointer-events:none}
.herobg video{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block;background:#050007}
.herobg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,4,24,.55) 0%,rgba(8,2,14,.72) 55%,rgba(5,0,7,.92) 100%)}
.bg-grid{z-index:1}.bg-orb{z-index:1}
body{padding-top:96px;padding-bottom:32px}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0)}
.nav .bar{display:flex;align-items:center;justify-content:space-between;height:56px;margin:8px auto 0;padding:0 10px 0 18px;width:min(1180px,100% - 24px);border:1px solid rgba(255,110,196,.22);border-radius:999px;background:rgba(11,5,16,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.logo img{height:36px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(255,45,149,.35))}
.logo .lt{font-family:'Dela Gothic One','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;font-size:18px;letter-spacing:1px;line-height:1;white-space:nowrap}
.logo .lt b{font-weight:400;background:linear-gradient(90deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;font-weight:700;letter-spacing:2px;text-decoration:none;transition:.25s}
.pill:hover{border-color:var(--pink);background:rgba(255,45,149,.08)}
.login-card{max-width:440px;padding:36px 30px;border-radius:32px;border:1px solid rgba(255,110,196,.28);background:linear-gradient(165deg,rgba(24,12,34,.78),rgba(10,5,16,.88));box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 70px rgba(255,45,149,.16)}
.login-card::before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--pink2),transparent)}
.brand-icon-wrap{width:auto;height:70px;padding:0;background:none;box-shadow:none;border-radius:0;margin:0 auto 16px}
.brand-icon-wrap img{height:100%;width:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 18px rgba(255,45,149,.55))}
.brand-name span{background:linear-gradient(90deg,var(--pink),var(--pink2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.brand-jp{margin-top:10px;font-family:'Dela Gothic One','Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;font-size:14px;letter-spacing:3px;color:var(--pink2);opacity:.9}
.brand-sub{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:4px;color:var(--pink2);text-shadow:0 0 14px rgba(255,45,149,.5)}
.brand-sub::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--pink2))}
.brand-sub::after{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(270deg,transparent,var(--pink2))}
.tab-switch{background:rgba(11,5,16,.8)}
.input-wrap input{background:rgba(11,5,16,.85)}
@media(max-width:480px){body{padding:84px 14px 24px;align-items:flex-start}.login-card{padding:30px 20px}.logo .lt{font-size:15px}.logo img{height:30px}}
@media(max-width:380px){.logo .lt{font-size:13px;letter-spacing:.5px}}

/* ===== fixes: font mismatch + wrapping ===== */
.logo .lt b,.brand-name span{font-family:inherit;font-weight:inherit}
.brand-sub{white-space:nowrap;justify-content:center;max-width:100%}
@media(max-width:480px){
  .brand-sub{font-size:10px;letter-spacing:2.5px;gap:8px}
  .brand-sub::before,.brand-sub::after{width:14px;flex:none}
}
@media(max-width:340px){.brand-sub{font-size:9px;letter-spacing:1.5px}}
</style>
</head>
<body>

<div class="herobg"><video id="bgVid" src="/home.mp4" poster="/home-poster.jpg" autoplay muted loop playsinline preload="auto"></video></div>
<div class="bg-grid"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<header class="nav">
    <div class="bar">
        <a href="/home" class="logo" aria-label="XIRUS MODZ"><img src="/logo.png" alt=""><span class="lt">ザイラス <b>モッズ</b></span></a>
        <a href="/home" class="pill"><i class="fa-solid fa-arrow-left"></i> HOME</a>
    </div>
</header>

<div class="login-card">
    <div class="brand">
        <div class="brand-icon-wrap"><img src="/logo.png" alt="XIRUS MODZ"></div>
        <div class="brand-jp">ザイラス モッズ</div>
        <div class="brand-sub" style="margin-top:12px">Command Center Access</div>
    </div>

    <div class="tab-switch">
        <button type="button" class="tab-btn active" id="tabLogin" onclick="switchTab('login')">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
        <button type="button" class="tab-btn" id="tabSignup" onclick="switchTab('signup')">
            <i class="fa-solid fa-user-plus"></i> Register
        </button>
    </div>

    <div class="msg error" id="errorBox">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Error</span>
    </div>
    <div class="msg success" id="successBox">
        <i class="fa-solid fa-circle-check"></i>
        <span id="successText">Success</span>
    </div>

    <div class="form-section active" id="formLogin">
        <form onsubmit="submitLogin(event)">
            <div class="field">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required>
                    <i class="fa-solid fa-user field-icon"></i>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>

    <div class="form-section" id="formSignup">
        <form onsubmit="submitSignup(event)">
            <div class="field">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" id="signup-username" placeholder="Choose username (min 3)" autocomplete="off" required>
                    <i class="fa-solid fa-user field-icon"></i>
                </div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" id="signup-password" placeholder="Min 5 characters" autocomplete="new-password" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                </div>
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <div class="input-wrap">
                    <input type="password" id="signup-confirm" placeholder="Retype password" autocomplete="new-password" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="signupBtn">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </form>
    </div>

    <div class="footer">
        <i class="fa-solid fa-shield-halved"></i> Secure Access Only
    </div>
</div>

<script>
(function(){var v=document.getElementById("bgVid");if(v){v.muted=true;var p=v.play&&v.play();if(p&&p.catch)p.catch(function(){});}})();
async function apiPost(url, body) {
    let r;
    try {
        r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, credentials: "same-origin", body: JSON.stringify(body)});
    } catch (e) {
        throw new Error("Cannot reach server (" + location.host + "). Check the server is running, then reload this page.");
    }
    let d = null;
    try { d = await r.json(); } catch (e) {}
    if (!d) throw new Error("Server error (HTTP " + r.status + "). Check the server terminal for details.");
    return d;
}
function switchTab(which) {
    document.getElementById("errorBox").classList.remove("show");
    document.getElementById("successBox").classList.remove("show");
    const tLogin = document.getElementById("tabLogin");
    const tSignup = document.getElementById("tabSignup");
    const fLogin = document.getElementById("formLogin");
    const fSignup = document.getElementById("formSignup");
    if (which === "login") {
        tLogin.classList.add("active"); tSignup.classList.remove("active");
        fLogin.classList.add("active"); fSignup.classList.remove("active");
    } else {
        tSignup.classList.add("active"); tLogin.classList.remove("active");
        fSignup.classList.add("active"); fLogin.classList.remove("active");
    }
}
function showError(msg) {
    document.getElementById("errorText").textContent = msg;
    document.getElementById("errorBox").classList.add("show");
    document.getElementById("successBox").classList.remove("show");
}
function showSuccess(msg) {
    document.getElementById("successText").textContent = msg;
    document.getElementById("successBox").classList.add("show");
    document.getElementById("errorBox").classList.remove("show");
}
async function submitLogin(e) {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in...';
    document.getElementById("errorBox").classList.remove("show");
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    try {
        const d = await apiPost("/api/login", { username, password });
        if (d.status === "ok") {
            showSuccess("Access granted. Redirecting...");
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Success';
            setTimeout(() => { window.location.href = "/dashboard"; }, 500);
            return;
        } else {
            showError(d.error || "Login failed");
        }
    } catch (err) {
        showError(err && err.message ? err.message : "Backend not reachable");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
    }
}
async function submitSignup(e) {
    e.preventDefault();
    const btn = document.getElementById("signupBtn");
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...';
    document.getElementById("errorBox").classList.remove("show");
    const username = document.getElementById("signup-username").value.trim();
    const password = document.getElementById("signup-password").value;
    const confirm = document.getElementById("signup-confirm").value;
    try {
        const d = await apiPost("/api/signup", { username, password, confirm });
        if (d.status === "ok") {
            showSuccess("Account created. Logging in...");
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Success';
            setTimeout(() => { window.location.href = "/dashboard"; }, 600);
            return;
        } else {
            showError(d.error || "Signup failed");
        }
    } catch (err) {
        showError(err && err.message ? err.message : "Backend not reachable");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
}
</script>
</body>
</html>
